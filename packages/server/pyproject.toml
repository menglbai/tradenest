[project]
name = "tradenest-server"
version = "0.0.1"
description = "TradeNest backend server (FastAPI + Agent kernel)"
# readme = "README.md"  # 此子包不单独发布 PyPI，外层仓库根目录有 README
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",      # SSE 流式输出
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # LLM SDK
    "anthropic>=0.40.0",
    "httpx>=0.28.0",

    # 数据源
    "akshare>=1.16.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",

    # 工具
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipython>=8.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradenest"]
