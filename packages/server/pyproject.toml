[project]
name = "tradenest-server"
version = "0.0.1"
description = "TradeNest backend server (FastAPI + Agent kernel)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # LLM SDKs
    "anthropic>=0.40.0",
    "openai>=1.55.0",

    # Agent frameworks
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",

    # Cache / queue
    "redis[hiredis]>=5.2.0",
    "celery>=5.4.0",

    # Data sources
    "akshare>=1.16.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",

    # Browser automation
    "playwright>=1.49.0",

    # HTTP client
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipython>=8.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradenest"]
