<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🪺 TradeNest · A股投资研究助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root {
  --bg: #0a0e1a;
  --panel: #0d1117;
  --card: #161b22;
  --card-hover: #1c2230;
  --border: #21262d;
  --border-light: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --text-muted: #6e7681;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --accent: #8b5cf6;
  --up: #ef4444;
  --down: #22c55e;
  --warn: #f59e0b;
  --success: #22c55e;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 8px;
  --radius-sm: 6px;
  --font-size: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--font-size);
  overflow: hidden;
  line-height: 1.5;
}
body.light {
  --bg: #f6f8fa;
  --panel: #ffffff;
  --card: #ffffff;
  --card-hover: #f0f3f6;
  --border: #d0d7de;
  --border-light: #afb8c1;
  --text: #1f2328;
  --text-dim: #656d76;
  --text-muted: #8b949e;
}

/* ===== Particle Canvas ===== */
#particle-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
}

/* ===== Layout ===== */
.app {
  position: relative; z-index: 1;
  display: grid;
  grid-template-rows: 48px 1fr;
  height: 100vh;
  width: 100vw;
  max-width: 100vw;
  overflow: hidden;
}
.main-area {
  display: flex;
  height: calc(100vh - 48px);
  overflow: hidden;
}
.sidebar { width: 180px; flex-shrink: 0; }
.chat-area { flex: 1; min-width: 0; }
.right-panel { width: var(--right-width, 350px); flex-shrink: 0; }

/* ===== Header ===== */
.header {
  display: flex;
  align-items: center;
  height: 48px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  gap: 16px;
  z-index: 100;
}
.logo {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.market-bar {
  flex: 1 1 0; min-width: 0; max-width: 100%;
  overflow: hidden;
  position: relative;
  height: 32px;
  display: flex;
  align-items: center;
  margin: 0 12px;
}
.market-bar-track {
  display: flex;
  gap: 24px;
  white-space: nowrap;
  animation: scroll-bar 60s linear infinite;
  font-size: 13px;
}
.market-bar-track:hover { animation-play-state: paused; }
@keyframes scroll-bar {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.market-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.market-item .name { color: var(--text-dim); }
.market-item .price { color: var(--text); font-weight: 600; }
.market-item .chg.up { color: var(--up); }
.market-item .chg.down { color: var(--down); }

.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.15s;
}
.icon-btn:hover {
  background: var(--card);
  color: var(--text);
  border-color: var(--border);
}
.role-select {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  height: 32px;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  margin-left: 4px;
}
.status-dot.error { background: var(--up); box-shadow: 0 0 6px var(--up); }

/* ===== Left Sidebar ===== */
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-section { padding: 12px; }
.sidebar-section.flex { flex: 1; overflow-y: auto; min-height: 0; }
.sidebar-section.bottom { border-top: 1px solid var(--border); }
.btn-new-chat {
  width: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-new-chat:hover { opacity: 0.9; }
.session-list { padding: 0 8px 8px 8px; }
.session-item {
  position: relative;
  padding: 8px 28px 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.15s;
}
.session-item:hover { background: var(--card); color: var(--text); }
.session-item.active { background: var(--card); color: var(--text); border-left: 2px solid var(--primary); padding-left: 8px; }
.session-item .del {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 4px;
  display: none; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text-muted);
}
.session-item:hover .del { display: inline-flex; }
.session-item .del:hover { background: var(--up); color: #fff; }

.search-box {
  position: relative;
}
.search-input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 13px;
  outline: none;
  transition: border 0.15s;
}
.search-input:focus { border-color: var(--primary); }
.search-dropdown {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 320px;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 200;
  display: none;
}
.search-dropdown.show { display: block; }
.search-result-item {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
.search-result-code { color: var(--primary); font-weight: 600; }
.search-result-name { color: var(--text); }
.search-result-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.search-result-actions button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 4px;
  padding: 3px 7px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.search-result-actions button:hover {
  border-color: var(--primary); color: var(--primary);
}

/* ===== Chat Area ===== */
.chat-area {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
  position: relative;
  min-width: 0;
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px 8px 24px;
  scroll-behavior: smooth;
}
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  padding: 20px;
}
.welcome-logo {
  font-size: 64px; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome-title {
  font-size: 24px; font-weight: 700; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome-sub { color: var(--text-dim); margin-bottom: 28px; font-size: 14px; }
.quick-q {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 720px;
}
.quick-q button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.quick-q button:hover {
  border-color: var(--primary); color: var(--primary); background: var(--card-hover);
}

.message {
  display: flex; margin-bottom: 18px;
  animation: msg-in 0.3s ease-out;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.message.user { justify-content: flex-end; }
.message-bubble {
  max-width: 78%;
  padding: 10px 14px;
  border-radius: 12px;
  word-wrap: break-word;
  position: relative;
}
.message.user .message-bubble {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
  border-bottom-right-radius: 2px;
}
.message.assistant .message-bubble {
  background: var(--card);
  color: var(--text);
  border-bottom-left-radius: 2px;
  border: 1px solid var(--border);
}
.message-bubble pre {
  background: var(--bg); padding: 10px; border-radius: 6px;
  overflow-x: auto; margin: 8px 0; border: 1px solid var(--border);
  font-size: 12.5px;
}
.message-bubble code {
  background: rgba(110,118,129,0.2); padding: 1px 6px; border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace; font-size: 12.5px;
}
.message-bubble pre code { background: transparent; padding: 0; }
.message-bubble table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
.message-bubble th, .message-bubble td { border: 1px solid var(--border-light); padding: 4px 8px; }
.message-bubble th { background: var(--bg); }
.message-bubble ul, .message-bubble ol { padding-left: 22px; margin: 6px 0; }
.message-bubble blockquote {
  border-left: 3px solid var(--primary); padding-left: 10px; color: var(--text-dim); margin: 6px 0;
}
.message-bubble a { color: var(--primary); }

.typing-cursor {
  display: inline-block;
  width: 8px; height: 14px; background: var(--primary);
  vertical-align: text-bottom; margin-left: 2px;
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.tool-call {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: rgba(59,130,246,0.1);
  border: 1px solid rgba(59,130,246,0.3);
  border-radius: 4px;
  font-size: 12px;
  color: var(--primary);
  margin: 4px 0;
}
.tool-call.success { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: var(--success); }
.tool-call.fail { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--up); }

.fav-btn {
  position: absolute; right: 6px; bottom: 6px;
  width: 22px; height: 22px;
  border-radius: 4px;
  background: rgba(0,0,0,0.3);
  color: var(--warn);
  border: none;
  cursor: pointer;
  font-size: 11px;
  opacity: 0;
  transition: opacity 0.15s;
}
.message.assistant:hover .fav-btn { opacity: 1; }
.fav-btn.active { opacity: 1; color: var(--warn); }

/* Input area */
.input-area {
  position: relative;
  border-top: 1px solid var(--border);
  background: var(--panel);
  padding: 10px 16px 14px;
  flex-shrink: 0;
}
.quick-tools {
  display: flex; gap: 6px; margin-bottom: 8px;
}
.quick-tools button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s;
}
.quick-tools button:hover {
  border-color: var(--primary); color: var(--primary);
}
.input-row {
  display: flex; gap: 8px; align-items: flex-end;
}
.chat-input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 14px;
  resize: none;
  min-height: 40px;
  max-height: 160px;
  outline: none;
  font-family: inherit;
  transition: border 0.15s;
}
.chat-input:focus { border-color: var(--primary); }
.btn-send {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  white-space: nowrap;
  align-self: flex-end;
}
.btn-send:hover { opacity: 0.9; }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== Right Panel ===== */
.right-panel {
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex !important;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  min-width: 280px;
}
/* 兜底：窗口太窄时改单列堆叠 */
@media (max-width: 1100px) {
  .sidebar { width: 60px !important; }
  .right-panel { width: 320px !important; }
  .sidebar .section-title { display: none; }
}
@media (max-width: 800px) {
  .sidebar, .right-panel { display: none !important; }
}
.resize-handle {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; cursor: ew-resize;
  background: transparent;
  z-index: 50;
  transition: background 0.15s;
}
.resize-handle:hover { background: var(--primary); }

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
  position: relative;
  z-index: 10;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1;
  min-width: 60px;
  padding: 10px 4px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: none;
}
.tab-content.active { display: block; }

/* Cards */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  text-align: center;
}
.summary-label { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; }
.summary-value { font-size: 15px; font-weight: 700; }
.up { color: var(--up); }
.down { color: var(--down); }

.position-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  margin-bottom: 8px;
  transition: border 0.15s;
}
.position-card:hover { border-color: var(--border-light); }
.position-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 6px;
}
.position-name { font-weight: 600; font-size: 13px; }
.position-code { color: var(--text-muted); font-size: 11px; margin-left: 4px; }
.position-price { font-size: 14px; font-weight: 700; }
.position-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px;
  font-size: 11.5px; color: var(--text-dim);
  margin: 6px 0;
}
.position-grid b { color: var(--text); font-weight: 500; }
.position-actions {
  display: flex; gap: 4px; margin-top: 8px;
}
.position-actions button {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 8px;
  font-size: 11px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.position-actions button:hover {
  border-color: var(--primary); color: var(--primary);
}

.btn-add {
  width: 100%;
  background: var(--card);
  border: 1px dashed var(--border-light);
  color: var(--text-dim);
  padding: 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
.btn-add:hover { border-color: var(--primary); color: var(--primary); }

.collapsible {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-top: 8px;
  overflow: hidden;
}
.collapsible-head {
  padding: 8px 10px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-dim);
  display: flex; justify-content: space-between;
}
.collapsible-body { padding: 0 10px 10px; display: none; }
.collapsible.open .collapsible-body { display: block; }
.collapsible.open .collapsible-head { border-bottom: 1px solid var(--border); margin-bottom: 8px; padding-bottom: 8px;}

.subtabs { display: flex; gap: 4px; margin-bottom: 10px; }
.subtab {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 10px;
  font-size: 11px;
  border-radius: 4px;
  cursor: pointer;
}
.subtab.active { background: var(--primary); border-color: var(--primary); color: #fff; }

.chart-container { width: 100%; height: 260px; background: var(--card); border-radius: var(--radius-sm); border: 1px solid var(--border); }

.list-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 10px;
  margin-bottom: 6px;
  font-size: 12.5px;
}
.list-item-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
.list-item-actions { display: flex; gap: 4px; margin-top: 6px; }
.list-item-actions button {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 4px;
  padding: 3px 7px;
  font-size: 11px;
  cursor: pointer;
}
.list-item-actions button:hover { border-color: var(--primary); color: var(--primary); }
.list-item-actions button.danger:hover { border-color: var(--up); color: var(--up); }

.inline-form {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  margin-bottom: 10px;
  display: grid; gap: 6px;
}
.inline-form input, .inline-form select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 12px;
  outline: none;
}
.inline-form input:focus, .inline-form select:focus { border-color: var(--primary); }
.inline-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn-primary {
  background: var(--primary);
  color: #fff; border: none;
  padding: 7px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 7px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}

.kline-controls {
  display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;
}
.kline-input-row { display: flex; gap: 6px; }
.kline-input-row input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 12px;
  outline: none;
}
.kline-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.kline-btns button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 11px;
  cursor: pointer;
}
.kline-btns button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.section-title {
  font-size: 12px;
  color: var(--text-dim);
  margin: 10px 0 6px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.empty-state {
  text-align: center;
  color: var(--text-muted);
  padding: 30px 12px;
  font-size: 12.5px;
}

/* ===== Modal ===== */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  display: none;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-mask.show { display: flex; }
.modal {
  background: var(--panel);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  width: 90%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
}
.modal-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-body { padding: 16px 18px; }
.modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.field input, .field select {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  padding: 8px 10px;
  font-size: 13px;
  outline: none;
  font-family: inherit;
}
.field input:focus, .field select:focus { border-color: var(--primary); }
.field-pwd { position: relative; }
.field-pwd .toggle-eye {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: transparent; border: none; color: var(--text-muted); cursor: pointer;
  font-size: 14px;
}

/* ===== Toast ===== */
.toast-host {
  position: fixed; top: 60px; right: 20px;
  z-index: 2000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--panel);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-size: 13px;
  box-shadow: var(--shadow);
  max-width: 320px;
  animation: toast-in 0.25s ease-out;
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--up); }
.toast.warn { border-color: var(--warn); }
@keyframes toast-in {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Loader */
.loader {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--border-light);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<script>
/* ============================================================
   TradeNest Frontend  -  IIFE main app
   ============================================================ */
(() => {
  'use strict';

  // ----- Global state -----
  const state = {
    sessions: [],
    currentSessionId: null,
    messages: [],
    streaming: false,
    role: 'default',
    fontSize: 14,
    theme: 'dark',
    rightWidth: 350,
    portfolio: { positions: [], summary: null, history: [] },
    watchlist: [],
    alerts: [],
    klinePeriod: 'daily',
    klineAdjust: 'qfq',
    klineChart: null,
    portfolioChart: null,
    portfolioChartType: 'curve',
    tradeMode: 'buy',
    tradeCode: '',
  };

  // ----- DOM helpers -----
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const el = (tag, props={}, ...kids) => {
    const e = document.createElement(tag);
    Object.entries(props).forEach(([k,v]) => {
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v !== undefined && v !== null) e.setAttribute(k, v);
    });
    kids.forEach(k => e.append(k));
    return e;
  };
  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ----- Toast -----
  const toastHost = $('#toast-host');
  function toast(msg, type='') {
    const t = el('div', { class: 'toast ' + type }, msg);
    toastHost.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
  }

  // ----- API helper -----
  async function api(path, opts={}) {
    try {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error(`${res.status} ${text}`);
      }
      const ct = res.headers.get('content-type') || '';
      return ct.includes('application/json') ? res.json() : res.text();
    } catch (e) {
      console.warn('api error', path, e);
      throw e;
    }
  }

  // ----- Particle background -----
  function initParticles() {
    const canvas = $('#particle-bg');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    let W, H, particles;
    function resize() {
      W = canvas.width = window.innerWidth * dpr;
      H = canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);
    particles = Array.from({length: 80}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3 * dpr,
      vy: (Math.random() - 0.5) * 0.3 * dpr,
      r: (Math.random() * 1.5 + 0.5) * dpr,
    }));
    function draw() {
      ctx.clearRect(0, 0, W, H);
      const isLight = document.body.classList.contains('light');
      const dotColor = isLight ? 'rgba(59,130,246,0.4)' : 'rgba(139,92,246,0.5)';
      const lineColor = isLight ? 'rgba(59,130,246,0.08)' : 'rgba(139,92,246,0.08)';
      ctx.fillStyle = dotColor;
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      // lines between near particles
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 1 * dpr;
      for (let i=0;i<particles.length;i++) for (let j=i+1;j<particles.length;j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx*dx + dy*dy;
        const limit = 120 * dpr;
        if (d2 < limit*limit) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
      requestAnimationFrame(draw);
    }
    draw();
  }

  // ----- Header: market bar -----
  async function loadMarketBar() {
    try {
      const d = await api('/api/market-bar');
      const items = d.items || d.data || d || [];
      const arr = Array.isArray(items) ? items : [];
      if (!arr.length) return;
      renderMarketBar(arr);
    } catch (e) {
      const track = $('#market-bar-track');
      track.innerHTML = '<span class="market-item"><span class="name">行情服务暂不可用</span></span>';
    }
  }
  function renderMarketBar(items) {
    const track = $('#market-bar-track');
    const html = items.map(it => {
      const chg = Number(it.pct_change ?? it.change ?? 0);
      const cls = chg >= 0 ? 'up' : 'down';
      const sign = chg >= 0 ? '+' : '';
      const price = it.price ?? it.last ?? '-';
      const name = it.name || it.code || '';
      return `<span class="market-item"><span class="name">${escapeHtml(name)}</span><span class="price">${escapeHtml(String(price))}</span><span class="chg ${cls}">${sign}${chg.toFixed(2)}%</span></span>`;
    }).join('');
    track.innerHTML = html + html; // duplicate for seamless scroll
  }
  setInterval(loadMarketBar, 30000);

  // ----- Sessions -----
  async function loadSessions() {
    try {
      const d = await api('/api/sessions');
      state.sessions = d.sessions || d.items || d || [];
      renderSessions();
    } catch (e) {
      console.warn('load sessions failed', e);
    }
  }
  function renderSessions() {
    const list = $('#session-list');
    list.innerHTML = '';
    if (!state.sessions.length) {
      list.innerHTML = '<div class="empty-state" style="padding:20px 8px;">暂无历史会话</div>';
      return;
    }
    state.sessions.forEach(s => {
      const id = s.id || s.session_id;
      const title = s.title || s.name || s.preview || ('会话 ' + (id || '').slice(0,6));
      const item = el('div', {
        class: 'session-item' + (id === state.currentSessionId ? ' active' : ''),
        title,
      }, title);
      item.addEventListener('click', () => switchSession(id));
      const del = el('button', { class: 'del', title: '删除' }, '✕');
      del.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        try {
          await api(`/api/sessions/${id}`, { method: 'DELETE' });
          if (id === state.currentSessionId) newSession();
          await loadSessions();
        } catch (e) { toast('删除失败', 'error'); }
      });
      item.appendChild(del);
      list.appendChild(item);
    });
  }
  async function switchSession(id) {
    state.currentSessionId = id;
    renderSessions();
    try {
      const d = await api(`/api/sessions/${id}`);
      state.messages = (d.messages || []).map(m => ({
        role: m.role,
        content: m.content,
      }));
      renderMessages();
    } catch (e) {
      console.error('[switchSession]', e);
      state.messages = [];
      renderMessages();
    }
  }
  function newSession() {
    state.currentSessionId = null;

      w.innerHTML = `
        <div class="welcome-logo">🪺</div>

          <button data-q="帮我分析一下我的持仓">💼 分析我的持仓</button>

  function buildMessageEl(m) {
    const isUser = m.role === 'user';
    const wrap = el('div', { class: 'message ' + (isUser ? 'user' : 'assistant') });
    const bubble = el('div', { class: 'message-bubble' });
    if (isUser) {
      bubble.textContent = m.content || '';
    } else {
      bubble.innerHTML = renderMarkdown(m.content || '');
      const fav = el('button', { class: 'fav-btn' + (m.favorited ? ' active' : ''), title: '收藏' }, '★');
      fav.addEventListener('click', () => {
        m.favorited = !m.favorited;
        fav.classList.toggle('active', m.favorited);
        toast(m.favorited ? '已收藏' : '已取消收藏', 'success');
      });
      bubble.appendChild(fav);
    }
    wrap.appendChild(bubble);
    return wrap;
  }
  function renderMarkdown(text) {
    if (!text) return '';
    try {
      if (window.marked && typeof window.marked.parse === 'function') {
        return window.marked.parse(text);
      } else if (typeof window.marked === 'function') {
        return window.marked(text);
      }
    } catch (e) {}
    return escapeHtml(text).replace(/\n/g, '<br/>');
  }
  function bindQuickQuestions() {
    $$('#welcome .quick-q button').forEach(b => {

  // ----- Chat send (SSE streaming) -----
  async function sendMessage() {
    const ta = $('#chat-input');
    const text = ta.value.trim();
    if (!text || state.streaming) return;
    ta.value = '';
    ta.style.height = '40px';

    // append user
    state.messages.push({ role: 'user', content: text });
    // append assistant placeholder
    const assistantMsg = { role: 'assistant', content: '', _streaming: true };
    state.messages.push(assistantMsg);
    renderMessages();

    state.streaming = true;
    $('#btn-send').disabled = true;

    const cont = $('#messages');
    // 选最后一个 assistant 消息的 bubble（更稳健：直接用 array.last 而非 :last-child）
    const allAssistant = cont.querySelectorAll('.message.assistant');
    const lastAssistantEl = allAssistant[allAssistant.length - 1];
    const lastBubble = lastAssistantEl ? lastAssistantEl.querySelector('.message-bubble') : null;
    if (!lastBubble) {
      console.error('[sendMessage] no lastBubble found');
      state.streaming = false;
      $('#btn-send').disabled = false;
      return;
    }

    let buffer = '';
    const toolCallEls = {};

    function appendCursor() {
      let cursor = lastBubble.querySelector('.typing-cursor');
      if (!cursor) {
        cursor = el('span', { class: 'typing-cursor' });
        lastBubble.appendChild(cursor);
      }
    }
    function rerender() {
      if (!lastBubble) { console.error('[rerender] lastBubble is null!'); return; }
      try {
        lastBubble.innerHTML = renderMarkdown(buffer);
      } catch(e) {
        console.error('[rerender] markdown error:', e);
        lastBubble.textContent = buffer;
      }
      // re-append tool calls already appended visually
      Object.values(toolCallEls).forEach(e => lastBubble.appendChild(e));
      appendCursor();
      cont.scrollTop = cont.scrollHeight;
    }

    try {
      const resp = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          session_id: state.currentSessionId,
          role: state.role,
        }),
      });
      if (!resp.ok || !resp.body) throw new Error('stream failed: ' + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let pending = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        pending += decoder.decode(value, { stream: true });
        // SSE: 支持 \n\n 和 \r\n\r\n 两种分隔
        // 先把所有 \r\n 规范化为 \n
        pending = pending.replace(/\r\n/g, '\n');
        let idx;
        while ((idx = pending.indexOf('\n\n')) >= 0) {
          const chunk = pending.slice(0, idx);
          pending = pending.slice(idx + 2);
          if (!chunk.trim()) continue;
          let evType = 'message', dataStr = '';
          chunk.split('\n').forEach(line => {
            if (line.startsWith('event:')) evType = line.slice(6).trim();
            else if (line.startsWith('data:')) dataStr += line.slice(5).trim();
          });
          let data = {};
          try { data = dataStr ? JSON.parse(dataStr) : {}; } catch (_) {}

          if (evType === 'text_delta') {
            buffer += data.text || '';
            rerender();
          } else if (evType === 'tool_start') {
              const name = data.tool_name || data.name || 'tool';
            const tEl = el('div', { class: 'tool-call' }, `⚙️ 正在调用 ${name}...`);
            toolCallEls[name] = tEl;
            lastBubble.appendChild(tEl);
            cont.scrollTop = cont.scrollHeight;
          } else if (evType === 'tool_end') {
            const name = data.tool_name || data.name || 'tool';
            const tEl = toolCallEls[name];
            const ok = data.success !== false;
            if (tEl) {
              tEl.className = 'tool-call ' + (ok ? 'success' : 'fail');
              tEl.textContent = (ok ? '✅ ' : '❌ ') + name + (ok ? ' 完成' : ' 失败');
            }
          } else if (evType === 'complete') {
            // remove cursor
            const cursor = lastBubble.querySelector('.typing-cursor');
            if (cursor) cursor.remove();
          } else if (evType === 'error') {
            buffer += `\n\n❌ 错误: ${data.error || '未知错误'}`;
            rerender();
          } else if (evType === 'session') {
            if (data.session_id) {
              state.currentSessionId = data.session_id;
              loadSessions();
            }
          }
        }
      }
    } catch (e) {
      buffer += `\n\n❌ ${e.message || '请求失败'}`;
      lastBubble.innerHTML = renderMarkdown(buffer);
    } finally {
      assistantMsg.content = buffer;
      assistantMsg._streaming = false;
      const cursor = lastBubble.querySelector('.typing-cursor');
      if (cursor) cursor.remove();
      // re-render to add fav button etc.
      const newEl = buildMessageEl(assistantMsg);
      lastBubble.parentElement.replaceWith(newEl);
      state.streaming = false;
      $('#btn-send').disabled = false;
      loadSessions();
    }
  }

  // ----- Stock Search -----
  let searchDebounce = null;
  function bindSearch() {
    const input = $('#search-input');
    const dropdown = $('#search-dropdown');
    input.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      const q = input.value.trim();
      if (!q) { dropdown.classList.remove('show'); dropdown.innerHTML = ''; return; }
      searchDebounce = setTimeout(() => doSearch(q), 500);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) dropdown.classList.remove('show');
    });
  }
  async function doSearch(q) {
    const dropdown = $('#search-dropdown');
    dropdown.innerHTML = '<div class="search-result-item"><span class="loader"></span> 搜索中...</div>';
    dropdown.classList.add('show');
    try {
      const d = await api('/api/search?q=' + encodeURIComponent(q));
      const items = d.results || d.items || d || [];
      if (!Array.isArray(items) || !items.length) {
        dropdown.innerHTML = '<div class="search-result-item"><div class="empty-state" style="padding:8px;">无结果</div></div>';
        return;
      }
      dropdown.innerHTML = '';
      items.slice(0, 30).forEach(it => {
        const code = it.code || it.symbol || '';
        const name = it.name || it.display_name || '';
        const item = el('div', { class: 'search-result-item' });
        item.innerHTML = `
          <div class="search-result-head">
            <span><span class="search-result-code">${escapeHtml(code)}</span> <span class="search-result-name">${escapeHtml(name)}</span></span>
          </div>
          <div class="search-result-actions">
            <button data-act="watch">👁 关注</button>
            <button data-act="kline">📈 K线</button>
            <button data-act="position">💼 持仓</button>
            <button data-act="ai">🤖 AI分析</button>
          </div>`;
        item.querySelectorAll('.search-result-actions button').forEach(b => {
          b.addEventListener('click', (e) => {
            e.stopPropagation();
            handleSearchAction(b.dataset.act, code, name);
            dropdown.classList.remove('show');
            $('#search-input').value = '';
          });
        });
        dropdown.appendChild(item);
      });
    } catch (e) {
      dropdown.innerHTML = '<div class="search-result-item"><div class="empty-state" style="padding:8px;color:var(--up);">搜索失败</div></div>';
    }
  }
  async function handleSearchAction(act, code, name) {
    if (act === 'watch') {
      try {
        await api('/api/portfolio/watchlist', {
          method: 'POST',
          body: JSON.stringify({ code, name }),
        });
        toast('已添加到关注', 'success');
        switchTab('watchlist');
        loadWatchlist();
      } catch (e) { toast('添加失败: ' + e.message, 'error'); }
    } else if (act === 'kline') {
      switchTab('kline');
      $('#kline-code').value = code;
      loadKLine();
    } else if (act === 'position') {
      switchTab('portfolio');
      openModal('modal-add-position');
      $('#ap-code').value = code;
      $('#ap-name').value = name;
      $('#ap-date').valueAsDate = new Date();
    } else if (act === 'ai') {
      $('#chat-input').value = `请分析一下 ${name}（${code}）这只股票，给我一个全面的研究报告。`;
      sendMessage();
    }
  }

    try {
      const [eq, attr, monthly] = await Promise.all([
        api('/api/portfolio/stats/equity-curve?days=30').catch(() => ({})),

  function renderPortfolioChart() {
    const dom = $('#portfolio-chart');
    if (!state.portfolioChart) state.portfolioChart = echarts.init(dom);
    const type = state.portfolioChartType;
    const dark = !document.body.classList.contains('light');
    const txt = dark ? '#e6edf3' : '#1f2328';
    let option;
    const charts = state.charts || {};
    if (type === 'curve') {
      const eq = charts.equity || {};
      const xs = eq.dates || [];
      const ys = eq.values || [];
      const cost = Number(eq.cost_line || 0);
      option = {
        backgroundColor: 'transparent',
        textStyle: { color: txt },
        tooltip: { trigger: 'axis' },
        grid: { left: 50, right: 12, top: 24, bottom: 30 },
        xAxis: { type: 'category', data: xs.length ? xs : ['暂无数据'] },
        yAxis: { type: 'value', scale: true },
        series: [
          { name: '总市值', type: 'line', smooth: true, data: ys, areaStyle: { opacity: 0.2 }, lineStyle: { color: '#3b82f6' }, itemStyle: { color: '#3b82f6' },
            markLine: cost > 0 ? { symbol:'none', silent:true, data:[{ yAxis: cost, name:'总成本', label:{ formatter:'成本: '+cost.toFixed(2), color:'#f59e0b' }, lineStyle:{ color:'#f59e0b', type:'dashed' } }] } : undefined,
          },
        ]
      };
    } else if (type === 'pie') {
      const items = (charts.attribution && charts.attribution.items) || [];
      const data = items.map(it => ({ name: it.name || it.code, value: Math.abs(Number(it.pnl || 0)), itemStyle: { color: Number(it.pnl) >= 0 ? '#ef4444' : '#22c55e' } }));
      option = {
        backgroundColor: 'transparent',
        textStyle: { color: txt },
        tooltip: { trigger: 'item', formatter: (p) => {
          const it = items.find(x => (x.name || x.code) === p.name) || {};
          return `${p.name}<br/>盈亏: ${(it.pnl||0).toFixed(2)}<br/>占比: ${p.percent}%`;
        }},
        legend: { bottom: 0, textStyle: { color: txt } },
        series: [{ type: 'pie', radius: ['40%','70%'], data: data.length ? data : [{name:'暂无数据',value:1, itemStyle:{color:'#374151'}}] }]
      };
    } else if (type === 'bar') {
      const m = charts.monthly || {};
      const xs = m.months || [];
      const ys = m.values || [];
      option = {
        backgroundColor: 'transparent',
        textStyle: { color: txt },
        tooltip: { trigger: 'axis' },
        grid: { left: 50, right: 12, top: 24, bottom: 30 },
        xAxis: { type: 'category', data: xs.length ? xs : ['暂无数据'] },
        yAxis: { type: 'value' },
        series: [{ type: 'bar', data: ys, itemStyle: { color: (p) => p.value >= 0 ? '#ef4444' : '#22c55e' } }]
      };
    } else { // calendar
      const today = new Date(); const year = today.getFullYear();
      option = {
        backgroundColor: 'transparent',
        textStyle: { color: txt },
        tooltip: {},
        calendar: { range: year, cellSize: ['auto', 14], itemStyle: { borderColor: 'transparent', color: dark ? '#161b22' : '#f0f3f6' }, splitLine: { show: false }, dayLabel: { color: txt }, monthLabel: { color: txt } },
        series: [{ type: 'heatmap', coordinateSystem: 'calendar', data: [] }],
        visualMap: { min: -3, max: 3, inRange: { color: ['#22c55e','#161b22','#ef4444'] }, show: false }
      };
    }
    state.portfolioChart.setOption(option, true);
    state.portfolioChart.resize();
  }

  // ----- K-Line -----
  async function loadKLine() {
    const code = $('#kline-code').value.trim();
    if (!code) { toast('请输入代码', 'warn'); return; }
    const dom = $('#kline-chart');
    if (!state.klineChart) state.klineChart = echarts.init(dom);
    state.klineChart.showLoading({ textColor: '#e6edf3', maskColor: 'rgba(13,17,23,0.6)' });
    try {
      const url = `/api/chart/kline?code=${encodeURIComponent(code)}&period=${state.klinePeriod}&adjust=${state.klineAdjust}&limit=120`;
      const d = await api(url);
      state.klineChart.hideLoading();
      renderKLine(d, code);
    } catch(e) {
      state.klineChart.hideLoading();
      toast('K线加载失败: ' + e.message, 'error');
    }
  }
  function renderKLine(d, code) {
    // 后端返回格式：{ dates, ohlcv: [[o,c,l,h]...], volumes, ma: {ma5,ma10,ma20,ma60} }
    // 也兼容旧格式 candles
    let dates, data, vols, maData = null;
    if (Array.isArray(d.dates) && Array.isArray(d.ohlcv)) {
      dates = d.dates;
      data = d.ohlcv;  // 已经是 [open, close, low, high]
      vols = d.volumes || [];
      maData = d.ma || null;
    } else {
      const candles = d.candles || d.kline || d.items || [];
      if (!Array.isArray(candles) || !candles.length) {
        state.klineChart.setOption({ title: { text: '无数据', left: 'center', textStyle: { color: '#8b949e' } } }, true);
        return;
      }
      dates = candles.map(c => c.date || c.time || c[0]);
      data = candles.map(c => Array.isArray(c) ? [c[1],c[2],c[3],c[4]] : [Number(c.open),Number(c.close),Number(c.low),Number(c.high)]);
      vols = candles.map(c => Array.isArray(c) ? c[5] : Number(c.volume || 0));
    }
    if (!dates || !dates.length || !data.length) {
      state.klineChart.setOption({ title: { text: '无数据', left: 'center', textStyle: { color: '#8b949e' } } }, true);
      return;
    }
    const ma = (n) => {
      // 优先使用后端 ma 字段
      const key = 'ma' + n;
      if (maData && Array.isArray(maData[key])) return maData[key].map(v => (v == null ? '-' : v));
      const out = [];
      for (let i=0;i<data.length;i++) {
        if (i<n-1) out.push('-');
        else {
          let s = 0;
          for (let j=0;j<n;j++) s += data[i-j][1];
          out.push((s/n).toFixed(2));
        }
      }
      return out;
    };
    // Cost line
    const pos = (state.portfolio.positions || []).find(p => (p.code || '').toLowerCase() === code.toLowerCase());
    const costLine = pos ? Number(pos.avg_price || pos.cost || 0) : null;

    const dark = !document.body.classList.contains('light');
    const txt = dark ? '#e6edf3' : '#1f2328';
    const grid = dark ? '#21262d' : '#d0d7de';

    const option = {
      backgroundColor: 'transparent',
      textStyle: { color: txt },
      legend: { data: ['K线','MA5','MA10','MA20','MA60'], textStyle: { color: txt }, top: 0 },
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
      axisPointer: { link: [{ xAxisIndex: 'all' }] },
      grid: [
        { left: 40, right: 12, top: 36, height: '58%' },
        { left: 40, right: 12, top: '74%', height: '18%' },
      ],
      xAxis: [
        { type: 'category', data: dates, gridIndex: 0, axisLine: { lineStyle: { color: grid } }, axisLabel: { color: txt }, scale: true, boundaryGap: false },
        { type: 'category', data: dates, gridIndex: 1, axisLine: { lineStyle: { color: grid } }, axisLabel: { show: false } },
      ],
      yAxis: [
        { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: grid, type: 'dashed' } }, axisLabel: { color: txt } },
        { gridIndex: 1, splitLine: { show: false }, axisLabel: { color: txt } },
      ],
      dataZoom: [
        { type: 'inside', xAxisIndex: [0,1], start: 50, end: 100 },
        { type: 'slider', xAxisIndex: [0,1], top: '94%', height: 14, start: 50, end: 100, textStyle: { color: txt } },
      ],
      series: [
        {
          name: 'K线', type: 'candlestick', data,
          itemStyle: { color: '#ef4444', color0: '#22c55e', borderColor: '#ef4444', borderColor0: '#22c55e' },
          markLine: costLine ? {
            symbol: 'none', silent: true,
            data: [{ yAxis: costLine, name: '成本', label: { formatter: '成本: ' + costLine.toFixed(2), color: '#f59e0b' }, lineStyle: { color: '#f59e0b', type: 'dashed' } }]
          } : undefined,
        },
        { name: 'MA5', type: 'line', data: ma(5), smooth: true, lineStyle: { width: 1, color: '#f59e0b' }, showSymbol: false },
        { name: 'MA10', type: 'line', data: ma(10), smooth: true, lineStyle: { width: 1, color: '#3b82f6' }, showSymbol: false },
        { name: 'MA20', type: 'line', data: ma(20), smooth: true, lineStyle: { width: 1, color: '#8b5cf6' }, showSymbol: false },
        { name: 'MA60', type: 'line', data: ma(60), smooth: true, lineStyle: { width: 1, color: '#ec4899' }, showSymbol: false },
        {
          name: '成交量', type: 'bar', data: vols,
          xAxisIndex: 1, yAxisIndex: 1,
          itemStyle: {
            color: (params) => {
              const idx = params.dataIndex;
              return data[idx] && data[idx][1] >= data[idx][0] ? '#ef4444' : '#22c55e';
            },
          },
        },
      ],
    };
    state.klineChart.setOption(option, true);
    state.klineChart.resize();
  }

  // ----- Resize handle -----
  function bindResize() {
    const handle = $('#resize-handle');
    let dragging = false;
    handle.addEventListener('mousedown', (e) => {
      dragging = true;
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ew-resize';
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const w = Math.min(680, Math.max(280, window.innerWidth - e.clientX));

      $('#main-area').style.setProperty('--right-width', w + 'px');

  let _initDone = false;
  function safeInit() {
    if (_initDone) return;
    _initDone = true;
    try { init(); } catch(e) {
      console.error('[TradeNest] init error:', e);
      // 显示错误信息给用户看
      const msg = document.createElement('div');
      msg.style.cssText = 'position:fixed;top:60px;right:20px;padding:12px 16px;background:#7f1d1d;color:#fff;border-radius:8px;z-index:9999;font-size:13px;max-width:400px;';
      msg.textContent = 'JS 错误: ' + e.message;
      document.body.appendChild(msg);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', safeInit);
  } else {
    safeInit();
  }
})();
</script>
