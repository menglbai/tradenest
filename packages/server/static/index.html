<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeNest — AI 投资研究助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root {
  --bg:        #0d0f18;
  --sidebar:   #111420;
  --surface:   #171b2e;
  --surface2:  #1e2340;
  --border:    #252d4a;
  --accent:    #4f8ef7;
  --accent2:   #7c5cfc;
  --green:     #22c55e;
  --red:       #ef4444;
  --yellow:    #f59e0b;
  --orange:    #f97316;
  --text:      #e2e8f0;
  --text2:     #94a3b8;
  --text3:     #4b5a7a;
  --r:         10px;
  --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:      'JetBrains Mono', 'Fira Code', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* ───────────── TOP BAR ───────────── */
.topbar {
  height: 48px; display: flex; align-items: center; gap: 10px;
  padding: 0 16px; background: var(--sidebar);
  border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10;
}
.logo { font-size: 20px; }
.app-name { font-weight: 700; font-size: 15px; }
.app-ver  { font-size: 11px; color: var(--text3); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.status-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 20px;
  background: var(--surface2); font-size: 11px; color: var(--text2);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.status-dot.err { background: var(--red); }

/* ───────────── LAYOUT ───────────── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ───────────── LEFT SIDEBAR ───────────── */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-section { padding: 10px 12px 4px; font-size: 10px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
.session-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.session-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px;
  cursor: pointer; font-size: 13px; color: var(--text2);
  margin-bottom: 2px; transition: all 0.15s;
}
.session-item:hover { background: var(--surface2); color: var(--text); }
.session-item.active { background: var(--surface2); color: var(--accent); }
.session-item .si-icon { font-size: 14px; flex-shrink: 0; }
.session-item .si-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-item .si-del { opacity: 0; font-size: 12px; color: var(--text3); cursor: pointer; }
.session-item:hover .si-del { opacity: 1; }
.new-session-btn {
  margin: 8px; padding: 8px; border-radius: 8px;
  border: 1px dashed var(--border); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 6px; color: var(--text3); font-size: 13px;
  transition: all 0.15s; background: none;
}
.new-session-btn:hover { border-color: var(--accent); color: var(--accent); }

/* 侧边栏底部 - 快捷工具 */
.sidebar-tools { border-top: 1px solid var(--border); padding: 8px; }
.tool-btn {
  width: 100%; padding: 7px 10px; border-radius: 7px;
  border: none; cursor: pointer; background: none;
  display: flex; align-items: center; gap: 8px;
  color: var(--text2); font-size: 12px; text-align: left;
  transition: all 0.15s;
}
.tool-btn:hover { background: var(--surface2); color: var(--text); }

/* ───────────── MAIN AREA ───────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ───────────── MARKET BAR ───────────── */
.market-bar {
  height: 36px; display: flex; align-items: center;
  padding: 0 16px; gap: 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow-x: auto;
}
.market-bar::-webkit-scrollbar { display: none; }
.mkt-item {
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap; font-size: 12px;
}
.mkt-name { color: var(--text3); }
.mkt-price { color: var(--text); font-weight: 600; font-family: var(--mono); }
.mkt-chg { font-family: var(--mono); font-size: 11px; }
.mkt-chg.up { color: var(--green); }
.mkt-chg.down { color: var(--red); }
.mkt-sep { color: var(--border); }
.mkt-loading { color: var(--text3); font-size: 12px; }
.mkt-refresh { margin-left: auto; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 13px; flex-shrink: 0; }
.mkt-refresh:hover { color: var(--accent); }

/* ───────────── CHAT AREA ───────────── */
.chat-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.chat-msgs {
  flex: 1; overflow-y: auto; padding: 20px 0;
  scroll-behavior: smooth;
}
.chat-msgs::-webkit-scrollbar { width: 4px; }
.chat-msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg-row { max-width: 800px; margin: 0 auto; padding: 0 20px 16px; display: flex; gap: 10px; }
.msg-row.user { flex-direction: row-reverse; }

.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0; background: var(--surface2);
}
.msg-row.user .avatar { background: #1e3560; }

.msg-body { max-width: 78%; display: flex; flex-direction: column; gap: 4px; }

.bubble {
  padding: 10px 14px; border-radius: var(--r);
  font-size: 14px; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--border);
  word-break: break-word;
}
.msg-row.user .bubble { background: #1a3060; border-color: #1e4080; color: #c8dcf8; }

/* Markdown */
.bubble h1,.bubble h2,.bubble h3 { font-size: 14px; color: var(--accent); margin: 10px 0 4px; }
.bubble p { margin: 4px 0; }
.bubble ul,.bubble ol { padding-left: 18px; margin: 4px 0; }
.bubble li { margin: 2px 0; }
.bubble code { background: #0d1525; padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12px; color: #7dd3fc; }
.bubble pre { background: #0d1525; padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
.bubble pre code { background: none; padding: 0; }
.bubble table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 13px; }
.bubble th,.bubble td { border: 1px solid var(--border); padding: 5px 9px; }
.bubble th { background: var(--surface2); color: var(--accent); }
.bubble strong { color: #93c5fd; }
.bubble blockquote { border-left: 3px solid var(--accent2); padding: 2px 10px; margin: 6px 0; color: var(--text2); }
.bubble a { color: var(--accent); }

/* Tool calls */
.tool-tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 5px; font-size: 11px;
  background: #0d1a2e; border: 1px solid var(--border);
  color: var(--text3); margin: 3px 0;
}
.tool-tag.done { color: var(--green); border-color: #1a3a1a; }
.tool-tag.err  { color: var(--red);   border-color: #3a1a1a; }

/* Meta */
.msg-meta { display: flex; gap: 10px; font-size: 11px; color: var(--text3); padding: 0 2px; }

/* Thinking */
.thinking-dots { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
.thinking-dots span {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  animation: bounce 1.2s infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: .2s; }
.thinking-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,100%{transform:translateY(0);opacity:.4} 50%{transform:translateY(-4px);opacity:1} }

/* ───────────── INPUT BAR ───────────── */
.input-bar {
  border-top: 1px solid var(--border);
  background: var(--surface); padding: 12px 16px;
  flex-shrink: 0;
}
.input-row { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.input-box {
  flex: 1; background: var(--surface2);
  border: 1px solid var(--border); border-radius: var(--r);
  color: var(--text); padding: 9px 12px;
  font-size: 14px; font-family: var(--font);
  resize: none; outline: none; line-height: 1.5; max-height: 160px;
  transition: border-color .2s;
}
.input-box:focus { border-color: var(--accent); }
.input-box::placeholder { color: var(--text3); }
.send-btn {
  width: 38px; height: 38px; border-radius: 9px;
  background: var(--accent); border: none; color: white;
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: all .2s; flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { background: #3b7de8; }
.send-btn:disabled { background: var(--border); cursor: not-allowed; }
.input-hint { max-width: 800px; margin: 5px auto 0; font-size: 11px; color: var(--text3); }

/* ───────────── EMPTY STATE ───────────── */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; padding: 40px; text-align: center;
}
.empty-icon { font-size: 44px; }
.empty-state h2 { font-size: 17px; color: var(--text2); }
.empty-state p { font-size: 13px; color: var(--text3); line-height: 1.6; }
.suggestions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 12px; max-width: 600px; }
.sug-chip {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 6px 13px; border-radius: 20px;
  font-size: 12px; cursor: pointer; color: var(--text2);
  transition: all .15s;
}
.sug-chip:hover { border-color: var(--accent); color: var(--accent); }

/* ───────────── RIGHT PANEL (可折叠) ───────────── */
.right-panel {
  width: 280px; flex-shrink: 0;
  background: var(--sidebar); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-tab-bar {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-tab {
  flex: 1; padding: 9px 4px; font-size: 11px; text-align: center;
  color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s;
}
.panel-tab.active { color: var(--accent); border-color: var(--accent); }
.panel-body { flex: 1; overflow-y: auto; padding: 12px; }
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); }

/* 行情卡片 */
.quote-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
}
.qc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.qc-name { font-size: 13px; font-weight: 600; }
.qc-code { font-size: 10px; color: var(--text3); }
.qc-price { font-size: 18px; font-weight: 700; font-family: var(--mono); }
.qc-chg { font-size: 12px; font-family: var(--mono); margin-top: 2px; }
.qc-chg.up { color: var(--green); }
.qc-chg.down { color: var(--red); }
.qc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin-top: 8px; font-size: 11px; }
.qc-label { color: var(--text3); }
.qc-val { color: var(--text2); font-family: var(--mono); }
.add-watch-btn {
  width: 100%; margin-top: 8px; padding: 8px;
  background: none; border: 1px dashed var(--border);
  border-radius: 7px; color: var(--text3); cursor: pointer;
  font-size: 12px; transition: all .15s;
}
.add-watch-btn:hover { border-color: var(--accent); color: var(--accent); }
.panel-empty { color: var(--text3); font-size: 12px; text-align: center; padding: 20px 0; }

/* 新闻列表 */
.news-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
.news-item:last-child { border-bottom: none; }
.news-time { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
.news-title { font-size: 12px; color: var(--text2); line-height: 1.5; cursor: pointer; }
.news-title:hover { color: var(--accent); }
.news-src { display: inline-block; font-size: 10px; color: var(--text3); background: var(--surface2); padding: 1px 5px; border-radius: 3px; margin-top: 3px; }

/* ───────────── ANIMATIONS ───────────── */
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.msg-row { animation: fadeUp .18s ease; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">🪺</div>
  <div>
    <div class="app-name">TradeNest</div>
    <div class="app-ver">v0.0.1</div>
  </div>
  <div class="topbar-right">
    <div class="status-pill">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusTxt">连接中</span>
    </div>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- LEFT SIDEBAR: 会话列表 -->
  <div class="sidebar">
    <div class="sidebar-section">会话</div>
    <button class="new-session-btn" onclick="newSession()">＋ 新建对话</button>
    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-tools">
      <button class="tool-btn" onclick="quickTool('market')">📊 市场行情速览</button>
      <button class="tool-btn" onclick="quickTool('news')">📰 宏观新闻</button>
      <button class="tool-btn" onclick="quickTool('flow')">💰 资金流向</button>
      <button class="tool-btn" onclick="clearCurrentSession()">🗑 清空当前对话</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- MARKET BAR -->
    <div class="market-bar">
      <div class="mkt-loading" id="mktBar">行情加载中…</div>
      <button class="mkt-refresh" onclick="loadMarketBar()" title="刷新行情">↻</button>
    </div>

    <!-- CHAT WRAP -->
    <div class="chat-wrap">
      <div class="chat-msgs" id="chatMsgs">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">📈</div>
          <h2>你好，我是 TradeNest</h2>
          <p>你的 AI 投资研究助手<br>实时行情 · 资金流向 · 宏观分析 · 多轮对话</p>
          <div class="suggestions">
            <div class="sug-chip" onclick="quickAsk(this)">贵州茅台今天怎么样？</div>
            <div class="sug-chip" onclick="quickAsk(this)">帮我看看外盘行情</div>
            <div class="sug-chip" onclick="quickAsk(this)">今天有什么重要政策新闻？</div>
            <div class="sug-chip" onclick="quickAsk(this)">宁德时代最近一个月走势分析</div>
            <div class="sug-chip" onclick="quickAsk(this)">茅台今日主力资金流向如何？</div>
            <div class="sug-chip" onclick="quickAsk(this)">对比三大指数与A股的关系</div>
          </div>
        </div>
      </div>

      <!-- INPUT BAR -->
      <div class="input-bar">
        <div class="input-row">
          <textarea class="input-box" id="inputBox" rows="1"
            placeholder="问我任何关于股票的问题… (Enter 发送，Shift+Enter 换行)"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">▶</button>
        </div>
        <div class="input-hint">支持多轮对话 · 实时数据 · AI 综合分析</div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="panel-tab-bar">
      <div class="panel-tab active" data-tab="watchlist" onclick="switchTab(this)">自选股</div>
      <div class="panel-tab" data-tab="news" onclick="switchTab(this)">快讯</div>
      <div class="panel-tab" data-tab="global" onclick="switchTab(this)">外盘</div>
      <div class="panel-tab" data-tab="kline" onclick="switchTab(this)">K线</div>
    </div>
    <div class="panel-body" id="panelBody">
      <!-- 自选股 -->
      <div id="tab-watchlist">
        <div id="watchlistCards"></div>
        <button class="add-watch-btn" onclick="addToWatchlist()">＋ 添加自选股</button>
        <div class="panel-empty" id="watchEmpty" style="display:none">暂无自选股<br><small>点击上方添加</small></div>
      </div>
      <!-- 快讯 -->
      <div id="tab-news" style="display:none">
        <div id="newsPanel"><div class="panel-empty">点击下方加载快讯</div></div>
        <button class="add-watch-btn" onclick="loadNewsPanel()">↻ 加载最新快讯</button>
      </div>
      <!-- 外盘 -->
      <div id="tab-global" style="display:none">
        <div id="globalPanel"><div class="panel-empty">点击下方加载外盘</div></div>
        <button class="add-watch-btn" onclick="loadGlobalPanel()">↻ 加载外盘行情</button>
      </div>
      <!-- K线图 -->
      <div id="tab-kline" style="display:none">
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input id="klineCode" type="text" placeholder="股票代码 600519" maxlength="6"
            style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:12px;outline:none;"
            onkeydown="if(event.key==='Enter')loadKline()">
          <select id="klineDays" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--text);font-size:12px;">
            <option value="20">20日</option>
            <option value="60" selected>60日</option>
            <option value="120">120日</option>
            <option value="250">250日</option>
          </select>
        </div>
        <button class="add-watch-btn" onclick="loadKline()">▶ 加载 K 线图</button>
        <div id="klineChart" style="width:100%;height:320px;margin-top:8px;"></div>
        <div id="klineEmpty" class="panel-empty">Enter 股票代码后点加载</div>
      </div>
    </div>
  </div>

</div><!-- /layout -->

<script>
// ════════════════════════════════════════
//  状态
// ════════════════════════════════════════
let sessions = [];         // [{id, name, history:[]}]  内存缓存
let curSid = null;         // 当前 session id
let isLoading = false;
let watchlist = JSON.parse(localStorage.getItem('tn_watchlist') || '["600519","000858","300750"]');

// ════════════════════════════════════════
//  初始化
// ════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  await loadSessionsFromDB();   // 先从 DB 加载历史会话
  if (sessions.length === 0) await newSession(true);  // 没有则新建
  checkHealth();
  loadMarketBar();
  loadWatchlistCards();
  setInterval(checkHealth, 30000);
  setInterval(loadMarketBar, 60000);
  document.getElementById('inputBox').focus();
});

// ════════════════════════════════════════
//  会话管理（持久化版）
// ════════════════════════════════════════
function genId() { return Date.now().toString(36); }

async function loadSessionsFromDB() {
  try {
    const r = await fetch('/api/sessions?limit=50');
    const d = await r.json();
    sessions = d.sessions.map(s => ({ id: s.id, name: s.name, history: null }));
    renderSessionList();
    if (sessions.length > 0) {
      await switchSession(sessions[0].id);
    }
  } catch(e) { console.warn('加载历史会话失败', e); }
}

async function newSession(silent) {
  try {
    const r = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: `对话 ${sessions.length + 1}` }),
    });
    const d = await r.json();
    sessions.unshift({ id: d.session_id, name: d.name, history: [] });
    switchSession(d.session_id, true);
    renderSessionList();
  } catch(e) {
    // 降级：本地会话
    const id = genId();
    sessions.unshift({ id, name: `对话 ${sessions.length+1}`, history: [] });
    switchSession(id, true);
    renderSessionList();
  }
  if (!silent) document.getElementById('inputBox').focus();
}

async function switchSession(id, skipLoad) {
  curSid = id;
  renderSessionList();
  const s = sessions.find(s => s.id === id);
  if (s && (s.history === null || s.history === undefined) && !skipLoad) {
    // 从 DB 加载消息
    try {
      const r = await fetch(`/api/sessions/${id}`);
      const d = await r.json();
      s.history = d.messages.map(m => ({ role: m.role, content: m.content }));
      s.name = d.session.name;
    } catch(e) { s.history = []; }
  }
  if (s && s.history === null) s.history = [];
  renderCurrentChat();
}

async function deleteSession(id, e) {
  e.stopPropagation();
  try { await fetch(`/api/sessions/${id}`, { method: 'DELETE' }); } catch(e) {}
  sessions = sessions.filter(s => s.id !== id);
  if (curSid === id) {
    if (sessions.length === 0) await newSession(true);
    else await switchSession(sessions[0].id);
  }
  renderSessionList();
}

function curSession() { return sessions.find(s => s.id === curSid); }

async function clearCurrentSession() {
  const s = curSession();
  if (!s) return;
  if (!confirm('清空这条对话的所有消息？')) return;
  try {
    await fetch(`/api/sessions/${s.id}`, { method: 'DELETE' });
    const r = await fetch('/api/sessions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: s.name }),
    });
    const d = await r.json();
    s.id = d.session_id; s.history = [];
    curSid = s.id;
  } catch(e) { s.history = []; }
  renderCurrentChat();
}

function renderSessionList() {
  const el = document.getElementById('sessionList');
  el.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id===curSid?'active':''}" onclick="switchSession('${s.id}')">
      <span class="si-icon">💬</span>

//  聊天渲染
// ════════════════════════════════════════
function renderCurrentChat() {
  const s = curSession();
  const container = document.getElementById('chatMsgs');
  if (!s || s.history.length === 0) {
    container.innerHTML = `<div class="empty-state" id="emptyState">
      <div class="empty-icon">📈</div>
      <h2>开始新的对话</h2>
      <p>问我任何关于市场的问题</p>
      <div class="suggestions">
        <div class="sug-chip" onclick="quickAsk(this)">贵州茅台今天怎么样？</div>
        <div class="sug-chip" onclick="quickAsk(this)">帮我看看外盘行情</div>
        <div class="sug-chip" onclick="quickAsk(this)">今天有什么重要政策新闻？</div>
      </div>
    </div>`;
    return;
  }
  container.innerHTML = '';
  s.history.forEach(m => {
    if (m.role === 'user') appendUserBubble(m.content, false);
    else appendAiBubble(m.content, [], 0, 0, 0, false);
  });
  scrollBottom();
}

function scrollBottom() {
  const c = document.getElementById('chatMsgs');
  c.scrollTop = c.scrollHeight;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function appendUserBubble(text, animate=true) {
  const c = document.getElementById('chatMsgs');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'msg-row user';
  if (!animate) el.style.animation = 'none';
  el.innerHTML = `<div class="avatar">👤</div><div class="msg-body"><div class="bubble">${esc(text)}</div></div>`;
  c.appendChild(el);
  scrollBottom();
}

function appendAiBubble(text, tools, rounds, durationMs, tokens, animate=true) {
  const c = document.getElementById('chatMsgs');
  const el = document.createElement('div');
  el.className = 'msg-row';
  if (!animate) el.style.animation = 'none';
  const bid = 'b' + genId();
  const mid = 'm' + genId();
  let toolHtml = tools.map(t =>
    `<div class="tool-tag done">✅ ${esc(t)}</div>`
  ).join('');
  const metaHtml = (rounds > 0)
    ? `<div class="msg-meta">
        <span>🔄 ${rounds}轮</span>
        <span>⏱ ${(durationMs/1000).toFixed(1)}s</span>
        ${tokens ? `<span>📊 ${tokens}tokens</span>` : ''}
       </div>`
    : '';
  el.innerHTML = `
    <div class="avatar">🪺</div>
    <div class="msg-body">
      <div>${toolHtml}</div>
      <div class="bubble" id="${bid}">${marked.parse(text)}</div>
      <div id="${mid}">${metaHtml}</div>
    </div>`;
  c.appendChild(el);
  scrollBottom();
  return { bid, mid };
}

function appendThinking() {
  const c = document.getElementById('chatMsgs');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'msg-row';
  el.id = 'thinkingRow';
  el.innerHTML = `<div class="avatar">🪺</div><div class="msg-body"><div class="bubble"><div class="thinking-dots"><span></span><span></span><span></span></div></div></div>`;
  c.appendChild(el);
  scrollBottom();
}

function quickAsk(el) { document.getElementById('inputBox').value = el.textContent; sendMessage(); }
function quickTool(t) {
  const msgs = {
    market: '帮我快速看一下今日A股市场整体行情和主要指数情况',
    news:   '今天有什么重要的宏观政策和市场新闻？',
    flow:   '当前市场主力资金流向怎么样？有哪些热点板块？',
  };

}

function handleKey(e) {

}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function setLoading(v) {
  isLoading = v;
  document.getElementById('sendBtn').disabled = v;
  document.getElementById('inputBox').disabled = v;
}

async function sendMessage() {
  if (isLoading) return;
  const box = document.getElementById('inputBox');
  const text = box.value.trim();
  if (!text) return;
  box.value = ''; box.style.height = 'auto';

  const s = curSession();
  if (!s) return;

  setLoading(true);
  appendUserBubble(text);
  s.history.push({ role: 'user', content: text });

  // 更新会话名（首条消息）
  if (s.history.length === 1) {
    s.name = text.slice(0, 18) + (text.length > 18 ? '…' : '');
    renderSessionList();
  }

  appendThinking();

  // 流式请求
  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        session_id: s.id,
        history: [],   // session_id 存在时后端从 DB 读，此字段忽略
      }),
    });

    document.getElementById('thinkingRow')?.remove();
    const { bid, mid } = appendAiBubble('', [], 0, 0, 0, true);

    let fullText = '';
    let toolsDone = [];
    let curToolId = null;

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      let curEvt = null;
      for (const line of lines) {
        if (line.startsWith('event: ')) curEvt = line.slice(7).trim();
        else if (line.startsWith('data: ') && curEvt) {
          try {
            const data = JSON.parse(line.slice(6));
            if (curEvt === 'text_delta') {
              fullText += data.text || '';
              document.getElementById(bid).innerHTML = marked.parse(fullText);
              scrollBottom();
            } else if (curEvt === 'tool_call_start') {
              const name = data.name || 'tool';
              curToolId = 'tc_' + genId();
              const bubble = document.getElementById(bid);
              const tag = document.createElement('div');
              tag.className = 'tool-tag'; tag.id = curToolId;
              tag.innerHTML = `⚙️ 调用 ${esc(name)}…`;
              bubble.parentElement.insertBefore(tag, bubble);
              scrollBottom();
            } else if (curEvt === 'tool_result') {
              if (curToolId) {
                const tag = document.getElementById(curToolId);
                if (tag) { tag.className = 'tool-tag done'; tag.textContent = '✅ ' + (data.name || 'tool'); }
                toolsDone.push(data.name || 'tool');
              }
            } else if (curEvt === 'complete') {
              const inTok  = data.total_input_tokens  || 0;
              const outTok = data.total_output_tokens || 0;
              const tokenStr = (inTok + outTok) > 0 ? `${inTok}+${outTok} tok` : '';
              document.getElementById(mid).innerHTML = `<div class="msg-meta">
                <span>🔄 ${data.rounds||1}轮</span>
                <span>⏱ ${((data.duration_ms||0)/1000).toFixed(1)}s</span>
                ${tokenStr ? `<span>📊 ${tokenStr}</span>` : ''}
              </div>`;
            } else if (curEvt === 'error') {
              document.getElementById(bid).innerHTML = `<span style="color:var(--red)">⚠️ ${esc(data.message||'未知错误')}</span>`;
            }
          } catch(e) {}
          curEvt = null;
        }
      }
    }

    s.history.push({ role: 'assistant', content: fullText });
    if (s.history.length > 40) s.history.splice(0, s.history.length - 40);

  } catch(err) {
    document.getElementById('thinkingRow')?.remove();
    const c = document.getElementById('chatMsgs');
    const el = document.createElement('div');
    el.className = 'msg-row';
    el.innerHTML = `<div class="avatar">🪺</div><div class="msg-body"><div class="bubble" style="color:var(--red)">
      ⚠️ 无法连接到后端：${esc(err.message)}<br>
      <small>请确认已启动：<code>uvicorn tradenest.main:app --reload</code></small>
    </div></div>`;
    c.appendChild(el);
  }

  setLoading(false);
  document.getElementById('inputBox').focus();
  scrollBottom();
}

function renderKline(d) {
  const el = document.getElementById('klineChart');
  if (!klineChart) klineChart = echarts.init(el, 'dark');
  klineChart.resize();

  // 涋红白：涨红跌白（A 股惯例）
  const upColor   = '#ef4444';
  const downColor = '#22c55e';

  const option = {
    backgroundColor: 'transparent',
    animation: true,
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      backgroundColor: '#1e2340',
      borderColor: '#252d4a',
      textStyle: { color: '#e2e8f0', fontSize: 11 },
      formatter(params) {
        const k = params.find(p => p.seriesName === 'K线');
        if (!k) return '';
        const [o,c,l,h] = k.value;
        const pct = d.pct_change[k.dataIndex] || 0;
        const col = c >= o ? upColor : downColor;
        return `<b>${d.dates[k.dataIndex]}</b><br/>
          开 <span style="color:${col}">${o}</span>&nbsp;
          收 <span style="color:${col}">${c}</span>&nbsp;
          涨跌 <span style="color:${col}">${pct>0?'+':''}${pct}%</span><br/>
          高 ${h}&nbsp; 低 ${l}`;
      }
    },
    legend: {
      data: ['K线','MA5','MA10','MA20'],
      textStyle: { color: '#94a3b8', fontSize: 10 },
      top: 0,
    },
    grid: [{ left: 50, right: 10, top: 30, bottom: 80 }],
    xAxis: [{
      type: 'category', data: d.dates,
      axisLabel: { color: '#4b5a7a', fontSize: 9, rotate: 30,
        formatter: v => v.slice(5) },
      axisLine: { lineStyle: { color: '#252d4a' } },
    }],
    yAxis: [{
      scale: true,
      axisLabel: { color: '#4b5a7a', fontSize: 9 },
      splitLine: { lineStyle: { color: '#1e2340' } },
    }],
    dataZoom: [
      { type: 'inside', start: 60, end: 100 },
      { type: 'slider', bottom: 0, height: 20, start: 60, end: 100,
        labelFormatter: '',
        borderColor: '#252d4a', backgroundColor: '#111420', fillerColor: '#1e2340',
        handleStyle: { color: '#4f8ef7' },
      }
    ],
    series: [
      {
        name: 'K线', type: 'candlestick',
        data: d.ohlcv,
        itemStyle: {
          color: upColor, color0: downColor,
          borderColor: upColor, borderColor0: downColor,
        },
      },
      { name:'MA5',  type:'line', data: d.ma.ma5,  smooth:true, lineStyle:{width:1,color:'#f59e0b'}, symbol:'none', connectNulls:true },
      { name:'MA10', type:'line', data: d.ma.ma10, smooth:true, lineStyle:{width:1,color:'#4f8ef7'}, symbol:'none', connectNulls:true },
      { name:'MA20', type:'line', data: d.ma.ma20, smooth:true, lineStyle:{width:1,color:'#22c55e'}, symbol:'none', connectNulls:true },
    ],
  };
  klineChart.setOption(option, true);
  // 添加标题
  document.getElementById('klineChart').title = `${d.name}(${d.code}) ${d.days}日K线${ d._mock ? ' [mock]' : '' }`;
}

async function fetchWatchlistQuotes() {
  if (watchlist.length === 0) return;
  const symbols = watchlist.map(c => (c.startsWith('6') ? 'sh' : 'sz') + c).join(',');
  try {
    const r = await fetch(`https://hq.sinajs.cn/list=${symbols}`, {
      headers: { Referer: 'https://finance.sina.com.cn/' }
    });
    const text = await r.text();
    for (const line of text.split('\n')) {
      if (!line.includes('"') || !line.includes(',')) continue;
      const key = line.split('=')[0].trim().replace(/^var hq_str_/, '');
      const code = key.slice(2);
      const parts = line.split('"')[1]?.split(',') || [];
      if (parts.length < 6 || !parts[3]) continue;
      const name = parts[0], open = parts[1], prev = parts[2], price = parts[3];
      const high = parts[4], low = parts[5];
      const amount = parseFloat(parts[9] || '0') / 100000000;
      const chg = (parseFloat(price) - parseFloat(prev)).toFixed(2);
      const pct = ((parseFloat(price) - parseFloat(prev)) / parseFloat(prev) * 100).toFixed(2);
      const up = parseFloat(chg) >= 0;

      const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
      const setC = (id, v, cls) => { const el = document.getElementById(id); if(el){el.textContent=v;el.className='qc-chg '+cls;} };
      set(`qn_${code}`, name);
      set(`qp_${code}`, '¥' + price);
      setC(`qc2_${code}`, `${up?'+':''}${chg}  ${up?'+':''}${pct}%`, up?'up':'down');
      set(`qo_${code}`, '¥' + open);
      set(`qh_${code}`, '¥' + high);
      set(`qa_${code}`, amount.toFixed(2) + '亿');
    }
  } catch(e) {}
}

function addToWatchlist() {
  const code = prompt('输入股票代码（如 600519）：');
  if (!code || !/^\d{6}$/.test(code.trim())) { alert('请输入6位股票代码'); return; }
  if (!watchlist.includes(code.trim())) {
    watchlist.push(code.trim());
    localStorage.setItem('tn_watchlist', JSON.stringify(watchlist));
    loadWatchlistCards();
  }
}

function removeWatch(code) {
  watchlist = watchlist.filter(c => c !== code);
  localStorage.setItem('tn_watchlist', JSON.stringify(watchlist));
  loadWatchlistCards();
}
